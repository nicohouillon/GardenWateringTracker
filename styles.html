<style>
        /* 1. Base styles (MOBILE FIRST) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 1em;
        }

        input[type="date"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus,
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-wrapper {
            position: relative;
            display: inline-block;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 25px;
            height: 25px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px 0;
            font-size: 1em;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .records-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .record {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #3b82f6;
            transition: all 0.3s ease;
        }

        .record:hover {
            transform: translateX(3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .record-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }

        .record-date {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1em;
        }

        .badge {
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .watered-badge { background: #3b82f6; }
        .not-watered-badge { background: #d97706; }

        .record-details {
            color: #6c757d;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .gardener-name {
            font-weight: 600;
            color: #495057;
        }

        .no-records {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 30px;
        }

        /* Week-at-a-glance strip */
        .week-strip {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .day-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 8px 4px;
            border: 2px solid #e9ecef;
            font-size: 0.75em;
            min-width: 0;
        }

        .day-cell.watered {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .day-cell.not-watered {
            background: #fef3c7;
            border-color: #d97706;
        }

        .day-cell.future {
            opacity: 0.4;
        }

        .day-cell .day-name {
            font-weight: 700;
            color: #495057;
            margin-bottom: 4px;
            font-size: 1em;
        }

        .day-cell .day-icon {
            font-size: 1.4em;
            line-height: 1;
        }

        .day-cell .day-num {
            color: #6c757d;
            margin-top: 3px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
            margin-left: 0;
            margin-top: 8px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        /* 2. Tablet and up */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }
            .container {
                border-radius: 20px;
                padding: 20px;
                margin: 20px auto;
                max-width: 800px;
            }
            h1 {
                font-size: 2em;
            }
            .form-section {
                padding: 25px;
                border-radius: 15px;
                margin-bottom: 30px;
            }
            .form-row {
                flex-direction: row;
                gap: 20px;
                margin-bottom: 20px;
            }
            .btn {
                width: auto;
                padding: 15px 30px;
                font-size: 16px;
                margin-top: 0;
            }
            .record-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 0;
            }
            .record-date {
                font-size: 1.1em;
            }
            .records-section {
                border-radius: 15px;
                padding: 25px;
            }
            .record {
                padding: 20px;
                border-radius: 12px;
                margin-bottom: 15px;
            }
            .delete-btn {
                margin-left: 10px;
                margin-top: 0;
            }
            .no-records {
                padding: 40px;
            }
        }

        /* 3. Desktop and up */
        @media (min-width: 900px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 2.5em;
            }
        }
    </style>
