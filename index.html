<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Watering Tracker</title>
    <style>
        /* 1. Base styles (MOBILE FIRST) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 1em;
        }

        input[type="date"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus,
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-wrapper {
            position: relative;
            display: inline-block;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 25px;
            height: 25px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px 0;
            font-size: 1em;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .records-section {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .record {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #3b82f6;
            transition: all 0.3s ease;
        }

        .record:hover {
            transform: translateX(3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .record-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }

        .record-date {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1em;
        }

        .badge {
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .watered-badge { background: #3b82f6; }
        .not-watered-badge { background: #d97706; }

        .record-details {
            color: #6c757d;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .gardener-name {
            font-weight: 600;
            color: #495057;
        }

        .no-records {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 30px;
        }

        /* Avatar Badge */
        .avatar-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #eef2ff;
            border-radius: 25px;
            padding: 10px 20px;
            margin: 12px auto;
            width: fit-content;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .avatar-badge:hover {
            background: #e0e7ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .avatar-badge:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.4);
        }

        .avatar-emoji {
            min-width: 48px;
            min-height: 48px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .avatar-name {
            font-weight: 600;
            color: #495057;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1em;
        }

        /* Avatar Picker Overlay */
        .avatar-picker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .avatar-picker-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .avatar-picker-title {
            text-align: center;
            margin-bottom: 16px;
            font-size: 1.2em;
            color: #2c3e50;
        }

        .avatar-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .avatar-picker-grid button {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            font-size: 1.5em;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .avatar-picker-grid button:hover {
            background: #e9ecef;
            transform: scale(1.1);
        }

        .avatar-picker-grid button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.4);
        }

        .avatar-picker-grid button.selected {
            border-color: #3b82f6;
            background: #dbeafe;
            box-shadow: inset 0 0 0 2px #3b82f6;
        }

        /* Week-at-a-glance strip */
        .week-strip {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .day-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 8px 4px;
            border: 2px solid #e9ecef;
            font-size: 0.75em;
            min-width: 0;
        }

        .day-cell.watered {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .day-cell.not-watered {
            background: #fef3c7;
            border-color: #d97706;
        }

        .day-cell.future {
            opacity: 0.4;
        }

        .day-cell .day-name {
            font-weight: 700;
            color: #495057;
            margin-bottom: 4px;
            font-size: 1em;
        }

        .day-cell .day-icon {
            font-size: 1.4em;
            line-height: 1;
        }

        .day-cell .day-num {
            color: #6c757d;
            margin-top: 3px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
            margin-left: 0;
            margin-top: 8px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        /* 2. Tablet and up */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }
            .container {
                border-radius: 20px;
                padding: 20px;
                margin: 20px auto;
                max-width: 800px;
            }
            h1 {
                font-size: 2em;
            }
            .avatar-badge {
                padding: 12px 24px;
                margin: 16px auto;
            }
            .avatar-name {
                max-width: 220px;
                font-size: 1.05em;
            }
            .avatar-picker-content {
                max-width: 400px;
                padding: 28px;
            }
            .avatar-picker-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .avatar-picker-grid button {
                width: 56px;
                height: 56px;
                font-size: 1.8em;
            }
            .form-section {
                padding: 25px;
                border-radius: 15px;
                margin-bottom: 30px;
            }
            .form-row {
                flex-direction: row;
                gap: 20px;
                margin-bottom: 20px;
            }
            .btn {
                width: auto;
                padding: 15px 30px;
                font-size: 16px;
                margin-top: 0;
            }
            .record-header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 0;
            }
            .record-date {
                font-size: 1.1em;
            }
            .records-section {
                border-radius: 15px;
                padding: 25px;
            }
            .record {
                padding: 20px;
                border-radius: 12px;
                margin-bottom: 15px;
            }
            .delete-btn {
                margin-left: 10px;
                margin-top: 0;
            }
            .no-records {
                padding: 40px;
            }
        }

        /* 3. Desktop and up */
        @media (min-width: 900px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 2.5em;
            }
            .avatar-badge {
                padding: 14px 28px;
                margin: 20px auto;
            }
            .avatar-emoji {
                font-size: 2.2em;
            }
            .avatar-name {
                max-width: 260px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Garden Watering Tracker</h1>

        <div id="avatarBadge" class="avatar-badge" role="button" tabindex="0"
             aria-label="Change your avatar">
            <span class="avatar-emoji" id="avatarEmoji"></span>
            <span class="avatar-name" id="avatarName"></span>
        </div>
        
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="gardener">Gardener Name:</label>
                    <input type="text" id="gardener" placeholder="Enter your name" required>
                </div>
            </div>
            
            <div class="checkbox-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="watered">
                </div>
                <label for="watered">Garden was watered today</label>
            </div>
            
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea id="notes" placeholder="Add any notes about watering, plant conditions, weather, etc."></textarea>
            </div>
            
            <button class="btn" id="addRecordBtn" onclick="addRecord()">Add Record</button>
            <!-- <button class="btn" onclick="testConnection()" style="background: #007bff; margin-left: 10px;">Test Connection</button> -->
        </div>
        
        <div class="records-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Watering Records</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" onclick="previousWeek()" style="padding: 8px 16px; font-size: 14px;">← Previous Week</button>
                    <span id="weekDisplay" style="font-weight: bold; color: #2c3e50;"></span>
                    <button class="btn" onclick="nextWeek()" style="padding: 8px 16px; font-size: 14px;">Next Week →</button>
                </div>
            </div>
            <div id="weekStrip" class="week-strip"></div>
            <div id="records"><div class="loading">Loading records...</div></div>
        </div>
    </div>

    <script>
        // Avatar constants
        const AVATAR_SET = [
          '🌻', '🌵', '🌷', '🍅', '🥕', '🌿',
          '🪴', '🐝', '🦋', '🐞', '🌈', '🍀',
          '🌸', '🌾', '🍄', '🪻'
        ];
        const DEFAULT_AVATAR = '🌱';
        let currentAvatar = null;

        function getAvatarStorageKey(name) { return 'avatar_' + name; }

        function getStoredAvatar(name) {
          try {
            return localStorage.getItem(getAvatarStorageKey(name)) || null;
          } catch (e) {
            return null;
          }
        }

        function storeAvatar(name, emoji) {
          try {
            localStorage.setItem(getAvatarStorageKey(name), emoji);
          } catch (e) {
            // Silent failure — avatar stays in memory for this session
          }
        }

        function assignRandomAvatar(name) {
          const emoji = AVATAR_SET[Math.floor(Math.random() * AVATAR_SET.length)];
          storeAvatar(name, emoji);
          currentAvatar = emoji;
          return emoji;
        }

        function truncateName(name) {
          if (!name) return '';
          return name.length > 30 ? name.substring(0, 30) + '…' : name;
        }

        function showAvatarBadge(emoji, name) {
          const badgeEl = document.getElementById('avatarBadge');
          const emojiEl = document.getElementById('avatarEmoji');
          const nameEl = document.getElementById('avatarName');
          emojiEl.textContent = emoji;
          nameEl.textContent = truncateName(name || '');
          badgeEl.style.display = 'flex';
          currentAvatar = emoji;
        }

        function initAvatar() {
          const gardenerName = localStorage.getItem('gardenerName');
          if (gardenerName) {
            const stored = getStoredAvatar(gardenerName);
            const emoji = stored || DEFAULT_AVATAR;
            showAvatarBadge(emoji, gardenerName);
          } else {
            showAvatarBadge(DEFAULT_AVATAR, '');
          }
        }

        function openAvatarPicker() {
          const overlay = document.getElementById('avatarPicker');
          const grid = document.getElementById('avatarGrid');

          // Generate emoji buttons
          grid.innerHTML = '';
          AVATAR_SET.forEach(function(emoji) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = emoji;
            btn.setAttribute('aria-label', emoji);
            if (emoji === currentAvatar) {
              btn.classList.add('selected');
            }
            btn.addEventListener('click', function() {
              closeAvatarPicker(emoji);
            });
            grid.appendChild(btn);
          });

          overlay.style.display = 'flex';

          // Focus the first grid button (or the selected one)
          var selected = grid.querySelector('.selected') || grid.querySelector('button');
          if (selected) selected.focus();

          // Trap focus within modal
          overlay.addEventListener('keydown', trapFocus);
        }

        function closeAvatarPicker(newEmoji) {
          const overlay = document.getElementById('avatarPicker');
          overlay.style.display = 'none';
          overlay.removeEventListener('keydown', trapFocus);

          if (newEmoji) {
            const gardenerName = localStorage.getItem('gardenerName');
            if (gardenerName) {
              storeAvatar(gardenerName, newEmoji);
            }
            showAvatarBadge(newEmoji, gardenerName || '');
          }

          // Return focus to badge
          document.getElementById('avatarBadge').focus();
        }

        function trapFocus(e) {
          const overlay = document.getElementById('avatarPicker');
          const focusable = overlay.querySelectorAll('button');
          if (focusable.length === 0) return;

          const first = focusable[0];
          const last = focusable[focusable.length - 1];

          if (e.key === 'Escape') {
            e.preventDefault();
            closeAvatarPicker(null);
            return;
          }

          if (e.key === 'Tab') {
            if (e.shiftKey) {
              if (document.activeElement === first) {
                e.preventDefault();
                last.focus();
              }
            } else {
              if (document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
            return;
          }

          // Arrow key navigation within the emoji grid
          var buttons = Array.from(focusable);
          var idx = buttons.indexOf(document.activeElement);
          var cols = 4;

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            if (idx >= 0 && idx < buttons.length - 1) {
              buttons[idx + 1].focus();
            }
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            if (idx > 0) {
              buttons[idx - 1].focus();
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (idx >= 0 && idx + cols < buttons.length) {
              buttons[idx + cols].focus();
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (idx >= cols) {
              buttons[idx - cols].focus();
            }
          }
        }

        // Initialize with today's date
        document.getElementById('date').valueAsDate = new Date();
        
        // Restore saved gardener name
        const savedGardener = localStorage.getItem('gardenerName');
        if (savedGardener) {
            document.getElementById('gardener').value = savedGardener;
        }

        initAvatar();

        // Avatar badge click handler
        document.getElementById('avatarBadge').addEventListener('click', openAvatarPicker);

        // Badge keyboard handler (Enter/Space opens picker)
        document.getElementById('avatarBadge').addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openAvatarPicker();
          }
        });

        // Backdrop click handler (close without changing)
        document.getElementById('avatarPicker').addEventListener('click', function(e) {
          if (e.target === this) {
            closeAvatarPicker(null);
          }
        });

        // Week navigation
        let currentWeekStart = getWeekStart(new Date());
        
        // Function to clear the form fields (keep gardener name)
        function clearForm() {
            document.getElementById('watered').checked = false;
            document.getElementById('notes').value = '';
        }

        // Function to disable/enable the add button
        function setAddButtonState(disabled) {
            const btn = document.getElementById('addRecordBtn');
            btn.disabled = disabled;
            btn.textContent = disabled ? 'Adding...' : 'Add Record';
        }

        function handleAddRecordSuccess(response) {
            console.log('Add record response:', response);
            setAddButtonState(false);
            
            if (response && response.success) {
                // alert('Record added successfully!');
                clearForm();
                displayRecords(); // Refresh display after successful add
            } else {
                const errorMsg = response ? response.error || 'Unknown error' : 'No response received';
                alert('Error adding record: ' + errorMsg);
            }
        }

        function handleAddRecordFailure(error) {
            console.error('Add record error:', error);
            setAddButtonState(false);
            alert('Failed to add record: ' + error.message);
        }

        function addRecord() {
            const date = document.getElementById('date').value;
            const gardener = document.getElementById('gardener').value.trim();
            const watered = document.getElementById('watered').checked;
            const notes = document.getElementById('notes').value.trim();
            
            if (!date || !gardener) {
                alert('Please fill in the date and gardener name.');
                return;
            }
            
            setAddButtonState(true);
            
            const recordData = {
                date: date,
                gardener: gardener,
                watered: watered,
                notes: notes
            };
            
            // Persist gardener name for next visit
            localStorage.setItem('gardenerName', gardener);
            
            // Avatar: look up or assign for this gardener
            const existingAvatar = getStoredAvatar(gardener);
            const avatar = existingAvatar || assignRandomAvatar(gardener);
            showAvatarBadge(avatar, gardener);
            
            console.log('Adding record:', recordData);
            
            google.script.run
                .withSuccessHandler(handleAddRecordSuccess)
                .withFailureHandler(handleAddRecordFailure)
                .addWateringRecord(recordData);
        }
        
        function handleDeleteRecordSuccess(response) {
            console.log('Delete record response:', response);
            if (response && response.success) {
                alert('Record deleted successfully!');
                displayRecords(); // Refresh display after successful delete
            } else {
                const errorMsg = response ? response.error || 'Unknown error' : 'No response received';
                alert('Error deleting record: ' + errorMsg);
            }
        }

        function handleDeleteRecordFailure(error) {
            console.error('Delete record error:', error);
            alert('Failed to delete record: ' + error.message);
        }

        function deleteRecord(date, gardener) {
            if (confirm('Are you sure you want to delete this record?')) {
                console.log('Deleting record for date:', date, 'gardener:', gardener);
                google.script.run
                    .withSuccessHandler(handleDeleteRecordSuccess)
                    .withFailureHandler(handleDeleteRecordFailure)
                    .deleteWateringRecord(date, gardener);
            }
        }

        function handleGetRecordsSuccess(response) {
            console.log('Get records response:', response);
            
            const recordsDiv = document.getElementById('records');
            updateWeekDisplay();
            
            if (response === null || response === undefined) {
                recordsDiv.innerHTML = `<div class="error">Received null response from server. Please check the Apps Script logs.</div>`;
                return;
            }
            
            if (response && response.success) {
                // Build week strip
                renderWeekStrip(response.records || []);

                if (response.records && response.records.length > 0) {
                    recordsDiv.innerHTML = response.records.map(record => {
                        const dateParts = record.date.split('-');
                        const year = parseInt(dateParts[0]);
                        const month = parseInt(dateParts[1]) - 1;
                        const day = parseInt(dateParts[2]);
                        const displayDate = new Date(year, month, day);
                        
                        const formattedDate = displayDate.toLocaleDateString('en-US', {
                            weekday: 'long',
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                        
                        // Escape for safe use in onclick attribute
                        const safeDate = record.date;
                        const safeGardener = record.gardener.replace(/'/g, "\\'");

                        return `
                            <div class="record">
                                <div class="record-header">
                                    <div class="record-date">${formattedDate}</div>
                                    <div>
                                        <span class="${record.watered ? 'watered-badge' : 'not-watered-badge'} badge">
                                            ${record.watered ? '💧 Watered' : 'Not Watered'}
                                        </span>
                                        <button class="delete-btn" onclick="deleteRecord('${safeDate}', '${safeGardener}')">Delete</button>
                                    </div>
                                </div>
                                <div class="record-details">
                                    <div><strong>Gardener:</strong> <span class="gardener-name">${record.gardener}</span></div>
                                    ${record.notes ? `<div><strong>Notes:</strong> ${record.notes}</div>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    renderWeekStrip([]);
                    recordsDiv.innerHTML = '<div class="no-records">No watering records found.</div>';
                }
            } else {
                const errorMsg = response ? response.error || 'Unknown error' : 'No response received';
                recordsDiv.innerHTML = `<div class="error">Error fetching records: ${errorMsg}</div>`;
            }
        }

        function handleGetRecordsFailure(error) {
            console.error('Get records error:', error);
            document.getElementById('records').innerHTML = `<div class="error">Failed to load records: ${error.message}</div>`;
        }

        function renderWeekStrip(records) {
            const strip = document.getElementById('weekStrip');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            // Build a set of dates that have at least one "watered" record
            const wateredDates = new Set();
            const loggedDates = new Set();
            records.forEach(r => {
                loggedDates.add(r.date);
                if (r.watered) wateredDates.add(r.date);
            });

            strip.innerHTML = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(currentWeekStart);
                d.setDate(d.getDate() + i);
                // Use local date parts to avoid UTC timezone shift
                const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const isFuture = d > today;
                const isLogged = loggedDates.has(iso);
                const isWatered = wateredDates.has(iso);

                let cellClass = 'day-cell';
                let icon = '';
                if (isFuture) {
                    cellClass += ' future';
                } else if (isWatered) {
                    cellClass += ' watered';
                    icon = '💧💧💧';
                } else if (isLogged) {
                    cellClass += ' not-watered';
                }

                return `
                    <div class="${cellClass}">
                        <span class="day-name">${dayNames[d.getDay()]}</span>
                        <span class="day-icon">${icon}</span>
                        <span class="day-num">${d.getDate()}</span>
                    </div>
                `;
            }).join('');
        }

        function displayRecords() {
            const recordsDiv = document.getElementById('records');
            recordsDiv.innerHTML = '<div class="loading">Loading records...</div>';
            
            const weekStartISO = currentWeekStart.toISOString().split('T')[0];
            console.log('Fetching records for week starting:', weekStartISO);
            
            google.script.run
                .withSuccessHandler(handleGetRecordsSuccess)
                .withFailureHandler(handleGetRecordsFailure)
                .getWateringRecords(weekStartISO);
        }
        
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day; // Sunday is 0
            const newDate = new Date(d.setDate(diff));
            newDate.setHours(0, 0, 0, 0); // Normalize to start of day
            return newDate;
        }
        
        function getWeekEnd(weekStart) {
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            weekEnd.setHours(23, 59, 59, 999); // Normalize to end of day
            return weekEnd;
        }

        function updateWeekDisplay() {
            const weekEnd = getWeekEnd(currentWeekStart);
            const startStr = currentWeekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const endStr = weekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            document.getElementById('weekDisplay').textContent = `${startStr} - ${endStr}`;
        }
        
        function previousWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            displayRecords();
        }
        
        function nextWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            displayRecords();
        }
        
        // // Test connection function
        // function testConnection() {
        //     console.log('Testing connection to Google Apps Script...');
            
        //     google.script.run
        //         .withSuccessHandler(function(response) {
        //             console.log('Test connection response:', response);
        //             if (response && response.success) {
        //                 alert(`Connection successful! Found ${response.rowCount} rows in spreadsheet.`);
        //             } else {
        //                 alert('Connection failed: ' + (response ? response.error : 'Unknown error'));
        //             }
        //         })
        //         .withFailureHandler(function(error) {
        //             console.error('Test connection error:', error);
        //             alert('Test connection failed: ' + error.message);
        //         })
        //         .testConnection();
        // }
        
        // Render strip immediately so layout is visible before data loads
        updateWeekDisplay();
        renderWeekStrip([]);

        // Initialize display
        displayRecords();
    </script>
